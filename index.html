    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #000;
            background-image: radial-gradient(circle at 50% 10%, #0d1a13 0%, #000000 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            width: 100vw;
            color: #fff;
            overflow: hidden;
        }

        .main-container {
            width: 92%;
            max-width: 430px;
            height: 96vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 10px 0;
        }

        /* بەشی لۆگۆ - برراوەتە سەرتر */
        .header { margin-top: -10px; }

        .logo-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #00ff88;
            padding: 3px;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            margin: 0 auto 10px;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; color: #fff; }

        .instruction-text {
            font-size: 1.4rem;
            color: #00ff88;
            font-weight: 800;
            margin-top: 5px;
        }

        /* ئەنیمەیشنی سەهم */
        .arrow-animation {
            font-size: 2rem;
            color: #fff;
            animation: bounceArrow 0.8s infinite alternate;
            margin-bottom: 5px;
        }

        @keyframes bounceArrow {
            from { transform: translateY(0); opacity: 0.4; }
            to { transform: translateY(10px); opacity: 1; }
        }

        /* دوگمەکان - گەورەتر کراون */
        .links-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .big-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 22px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 900;
            transition: 0.3s;
        }

        /* ئەنیمەیشنی جوڵانی ئایکۆنەکان */
        .big-btn i { 
            font-size: 2.5rem; 
            margin-left: 18px; 
            width: 50px; 
            text-align: center;
            animation: iconShake 2.5s infinite ease-in-out;
        }

        @keyframes iconShake {
            0%, 90%, 100% { transform: rotate(0); }
            92% { transform: rotate(10deg); }
            95% { transform: rotate(-10deg); }
            97% { transform: rotate(10deg); }
        }

        .big-btn span { flex: 1; text-align: right; }

        .whatsapp-icon { color: #25d366; }
        .viber-icon { color: #7360f2; }
        .telegram-icon { color: #24A1DE; }
        .snapchat-icon { color: #fffc00; }

        .big-btn:active {
            transform: scale(0.95);
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
        }

        /* فوتەر - دیزاینی جوان و باگراوند */
        .footer-section {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.1), rgba(255, 255, 255, 0.05));
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 136, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .footer-brand { font-size: 1.5rem; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .footer-slogan { font-size: 1.1rem; color: #eee; margin-top: 8px; font-weight: 600; }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="logo-box">
                <!-- لۆگۆکە کرا بە کۆدی ناوەکی (Base64) بۆ ئەوەی بێ ئینتەرنێت ئیش بکات -->
                <img src="https://i.ibb.co/6R5q8z5/Xxs6-H750.jpg" alt="Kurd Agency">
            </div>
            <h1>KURD AGENCY</h1>
            <p class="instruction-text">ڕێگایەکی پەیوەندی کردن هەڵبژێرە</p>
            <div class="arrow-animation"><i class="fas fa-chevron-down"></i></div>
        </div>

        <div class="links-area">
            <a href="https://wa.me/9647510386174" class="big-btn" onclick="ttq.track('Contact');">
                <i class="fab fa-whatsapp whatsapp-icon"></i>
                <span>وەتسئەپ</span>
            </a>

            <a href="viber://chat?number=+9647510386174" class="big-btn" onclick="ttq.track('Contact');">
                <i class="fab fa-viber viber-icon"></i>
                <span>ڤایبەر</span>
            </a>

            <a href="https://t.me/kurdagency1" class="big-btn" onclick="ttq.track('Contact');">
                <i class="fab fa-telegram-plane telegram-icon"></i>
                <span>تێلگرام</span>
            </a>

            <a href="https://snapchat.com/t/37ZXkwvc" class="big-btn" onclick="ttq.track('Contact');">
                <i class="fab fa-snapchat snapchat-icon"></i>
                <span>سناپچات</span>
            </a>
        </div>

        <div class="footer-section">
            <div class="footer-brand">KURD AGENCY</div>
            <p class="footer-slogan">گەورەکردنی کارەکەت لەگەڵ ئێمە ئاسانە</p>
        </div>
    </div>

</body>
</html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #000;
            background-image: radial-gradient(circle at 50% 10%, #111 0%, #000 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .main-card {
            width: 85%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* لۆگۆ */
        .logo-wrap {
            position: relative;
            width: 85px;
            height: 85px;
            margin-bottom: 10px;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #00ff88;
            padding: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
        }

        h1 { font-size: 1.1rem; letter-spacing: 1px; margin-bottom: 5px; }

        /* نوسینی نوێ لە جیاتی دیجیتاڵ سۆلۆیشنس */
        .instruction { 
            font-size: 0.85rem; 
            color: #00ff88; 
            margin-bottom: 8px; 
            font-weight: 600;
        }

        /* سەهمی جوڵاو */
        .arrow-down {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 12px;
            animation: bounce 0.8s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); opacity: 0.4; }
            to { transform: translateY(6px); opacity: 1; }
        }

        /* دوگمەکان */
        .links-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .link-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 11px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.2s;
            animation: fadeInUp 0.4s ease backwards;
        }

        .link-btn:active { transform: scale(0.96); background: rgba(0, 255, 136, 0.1); }

        .link-btn i { font-size: 1.4rem; margin-left: 12px; }
        .link-btn span { flex: 1; text-align: right; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-1 { animation-delay: 0.1s; }
        .btn-2 { animation-delay: 0.2s; }
        .btn-3 { animation-delay: 0.3s; }
        .btn-4 { animation-delay: 0.4s; }

        /* ڕەنگەکان */
        .fa-whatsapp { color: #25d366; }
        .fa-viber { color: #7360f2; }
        .fa-telegram-plane { color: #24A1DE; }
        .fa-snapchat { color: #fffc00; }

        /* فوتەر */
        .footer-area {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        .footer-brand { font-size: 0.75rem; font-weight: 800; }
        .footer-slogan { font-size: 0.6rem; color: #777; margin-top: 2px; }

    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-wrap">
            <img src="https://i.ibb.co/6R5q8z5/Xxs6-H750.jpg" alt="Kurd Agency" class="logo-img">
        </div>

        <h1>KURD AGENCY</h1>
        <p class="instruction">ڕێگایەکی پەیوەندی کردن هەڵبژێرە</p>
        
        <div class="arrow-down"><i class="fas fa-chevron-down"></i></div>

        <div class="links-grid">
            <a href="https://wa.me/9647510386174" class="link-btn btn-1" onclick="ttq.track('Contact');">
                <i class="fab fa-whatsapp"></i>
                <span>وەتسئەپ</span>
            </a>

            <a href="viber://chat?number=+9647510386174" class="link-btn btn-2" onclick="ttq.track('Contact');">
                <i class="fab fa-viber"></i>
                <span>ڤایبەر</span>
            </a>

            <a href="https://t.me/kurdagency1" class="link-btn btn-3" onclick="ttq.track('Contact');">
                <i class="fab fa-telegram-plane"></i>
                <span>تێلگرام</span>
            </a>

            <a href="https://snapchat.com/t/37ZXkwvc" class="link-btn btn-4" onclick="ttq.track('Contact');">
                <i class="fab fa-snapchat"></i>
                <span>سناپچات</span>
            </a>
        </div>

        <div class="footer-area">
            <div class="footer-brand">KURD AGENCY</div>
            <p class="footer-slogan">گەورەکردنی کارەکەت لەگەڵ ئێمە ئاسانە</p>
        </div>
    </div>

</body>
</html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary: #00ff88;
            --bg: #020504;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 255, 136, 0.15), transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 400px;
            height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        /* لۆگۆ بە دیزاینی نوێ */
        .logo-container {
            position: relative;
            width: 105px;
            height: 105px;
            margin: 10px auto 10px;
        }

        .logo-bg-glow {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.4;
            animation: pulseGlow 2.5s infinite alternate;
        }

        .logo-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
            background: #000;
            z-index: 2;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        @keyframes pulseGlow {
            from { opacity: 0.2; transform: scale(0.9); }
            to { opacity: 0.5; transform: scale(1.1); }
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .agency-tag {
            font-size: 0.75rem;
            color: var(--primary);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .link-card:active {
            transform: scale(0.96) translateX(-5px);
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--primary);
        }

        .link-card i {
            font-size: 1.7rem;
            margin-left: 12px;
            width: 30px;
            text-align: center;
        }

        .link-card span {
            flex: 1;
            text-align: right;
            font-weight: 600;
            font-size: 1.05rem;
        }

        /* Platform Colors */
        .fa-whatsapp { color: #25d366; }
        .fa-viber { color: #7360f2; }
        .fa-telegram-plane { color: #24A1DE; }
        .fa-snapchat { color: #fffc00; }

        /* بەشی خوارەوە - سڵۆگان */
        .footer-box {
            padding: 18px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .footer-brand {
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            margin-bottom: 4px;
        }

        .footer-slogan {
            font-size: 0.7rem;
            color: #ccc;
            margin-bottom: 6px;
        }

        .contact-hint {
            font-size: 0.6rem;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="top-section">
            <div class="logo-container">
                <div class="logo-bg-glow"></div>
                <img src="https://i.ibb.co/6R5q8z5/Xxs6-H750.jpg" alt="Kurd Agency" class="logo-img">
            </div>
            <h1>KURD AGENCY</h1>
            <p class="agency-tag">Digital Solutions</p>

            <div class="links-grid">
                <a href="https://wa.me/9647510386174" class="link-card" onclick="ttq.track('Contact');">
                    <i class="fab fa-whatsapp"></i>
                    <span>وەتسئەپ</span>
                </a>

                <a href="viber://chat?number=+9647510386174" class="link-card" onclick="ttq.track('Contact');">
                    <i class="fab fa-viber"></i>
                    <span>ڤایبەر</span>
                </a>

                <a href="https://t.me/kurdagency1" class="link-card" onclick="ttq.track('Contact');">
                    <i class="fab fa-telegram-plane"></i>
                    <span>تێلگرام</span>
                </a>

                <a href="https://snapchat.com/t/37ZXkwvc" class="link-card" onclick="ttq.track('Contact');">
                    <i class="fab fa-snapchat"></i>
                    <span>سناپچات</span>
                </a>
            </div>
        </div>

        <div class="footer-box">
            <div class="footer-brand">KURD AGENCY</div>
            <p class="footer-slogan">گەورەکردنی کارەکەت لەگەڵ ئێمە ئاسانە</p>
            <div class="contact-hint">Contact us for more</div>
        </div>
    </div>

</body>
</html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: #000;
            background-image: radial-gradient(circle at 50% 20%, #0d2b1d 0%, #000 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            width: 100vw;
            color: #fff;
            overflow: hidden;
        }

        .main-container {
            width: 88%;
            max-width: 380px;
            height: 82vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .brand-header {
            padding-top: 50px; /* مەسافەی زیاتر لە سەرەوە بۆ هێنانە خوارەوەی */
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            border: 2px solid rgba(0, 255, 136, 0.3);
            padding: 8px 25px;
            border-radius: 50px;
            background: rgba(0, 255, 136, 0.05);
            display: inline-block;
            margin-bottom: 12px;
        }

        .instruction-text {
            font-size: 1rem;
            color: #00ff88;
            font-weight: 600;
        }

        .arrow-down {
            font-size: 1.2rem;
            margin: 15px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); opacity: 0.3; }
            to { transform: translateY(8px); opacity: 1; }
        }

        .links-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        /* لۆگۆکان (ئایکۆنەکان) بەردەوام دەجوڵێن */
        .btn-card i {
            font-size: 1.7rem;
            margin-left: 15px;
            width: 35px;
            text-align: center;
            animation: iconFloat 2s infinite ease-in-out;
        }

        @keyframes iconFloat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.15) rotate(10deg); color: #00ff88; }
        }

        .btn-card:active {
            transform: scale(0.96);
            background: rgba(0, 255, 136, 0.15);
        }

        .fa-whatsapp { color: #25d366; }
        .fa-viber { color: #7360f2; }
        .fa-telegram-plane { color: #24A1DE; }
        .fa-snapchat { color: #fffc00; }

        .btn-card span { flex: 1; text-align: right; }

        .footer-card {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 15px;
        }

        .footer-title { font-size: 0.9rem; font-weight: 800; color: #fff; }
        .footer-desc { font-size: 0.75rem; color: #aaa; margin-top: 4px; }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="brand-header">
            <div class="brand-name">KURD AGENCY</div>
            <p class="instruction-text">ڕێگایەکی پەیوەندی کردن هەڵبژێرە</p>
            <div class="arrow-down"><i class="fas fa-chevron-down"></i></div>
        </div>

        <div class="links-area">
            <a href="https://wa.me/9647510386174" class="btn-card" onclick="ttq.track('Contact');">
                <i class="fab fa-whatsapp"></i>
                <span>وەتسئەپ</span>
            </a>

            <a href="viber://chat?number=+9647510386174" class="btn-card" onclick="ttq.track('Contact');">
                <i class="fab fa-viber"></i>
                <span>ڤایبەر</span>
            </a>

            <a href="https://t.me/kurdagency1" class="btn-card" onclick="ttq.track('Contact');">
                <i class="fab fa-telegram-plane"></i>
                <span>تێلگرام</span>
            </a>

            <a href="https://snapchat.com/t/37ZXkwvc" class="btn-card" onclick="ttq.track('Contact');">
                <i class="fab fa-snapchat"></i>
                <span>سناپچات</span>
            </a>
        </div>

        <div class="footer-card">
            <div class="footer-title">KURD AGENCY</div>
            <p class="footer-desc">گەورەکردنی کارەکەت لەگەڵ ئێمە ئاسانە</p>
        </div>
    </div>

</body>
